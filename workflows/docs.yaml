workflow:
  name: docs
  description: Documentation updates.
  version: "0.3.0"
  expansion: per-repo
  phases:
    - name: write
      agent: tech-writer
      repo: $each
    - name: review
      agent: reviewer
      repos: $all
      gate:
        file: gates/approval
    - name: finish
      agent: pm
      gate:
        file: gates/design-complete
  triggers:
    default: false
