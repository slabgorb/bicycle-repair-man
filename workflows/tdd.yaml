workflow:
  name: tdd
  description: Test-driven development across one or more repos.
  version: "0.3.0"
  expansion: per-repo
  phases:
    - name: red
      agent: tea
      repo: $each
      gate:
        file: gates/tests-fail
        condition: All ACs covered with failing tests in ${repo.name}
    - name: green
      agent: dev
      repo: $each
      gate:
        file: gates/tests-pass
        condition: Tests passing, tree clean in ${repo.name}
    - name: review
      agent: reviewer
      repos: $all
      gate:
        file: gates/approval
        condition: Reviewer approved
    - name: finish
      agent: pm
      gate:
        file: gates/design-complete
        condition: All phases passed, ACs checked
  triggers:
    default: false
